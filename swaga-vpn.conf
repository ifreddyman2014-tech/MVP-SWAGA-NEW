# NGINX конфигурация для SWAGA VPN
#
# Файл: /etc/nginx/sites-available/swaga-vpn.conf
# Архитектура:
#   - Порт 443 (NGINX) — VLESS трафик + проксирование 3X-UI панели
#   - Порт 2055 (3X-UI) — панель управления напрямую
#   - Бот подключается к 3X-UI напрямую через порт 2055
#
# 3X-UI web base path: /JXmOAqpCBtH14wRJ2t
# (настраивается в 3X-UI → Settings → Panel URL Root Path)

# Редирект HTTP → HTTPS
server {
    listen 80;
    server_name swaga-vpn.ru www.swaga-vpn.ru sub.swaga-vpn.ru;
    return 301 https://$host$request_uri;
}

# ── sub.swaga-vpn.ru — сервер подписок ──────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name sub.swaga-vpn.ru;

    ssl_certificate     /etc/letsencrypt/live/sub.swaga-vpn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.swaga-vpn.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location /sub/ {
        proxy_pass         http://127.0.0.1:8888/sub/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /connect/ {
        proxy_pass         http://127.0.0.1:8888/connect/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /webhook/ {
        proxy_pass         http://127.0.0.1:8888/webhook/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    server_name swaga-vpn.ru www.swaga-vpn.ru;

    ssl_certificate     /etc/letsencrypt/live/swaga-vpn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swaga-vpn.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location /JXmOAqpCBtH14wRJ2t/ {
        proxy_pass         http://127.0.0.1:2055/JXmOAqpCBtH14wRJ2t/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        return 404;
    }
}
