name: Build Android APK

on:
  push:
    branches: [ master, main, "claude/*" ]
    paths:
      - 'android/**'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"
          sdkmanager --licenses <<< "y" || true

      - name: Download libxray.aar
        working-directory: android/app
        run: |
          mkdir -p libs
          # Download libxray AAR from latest release
          LIBXRAY_URL=$(curl -fsSL https://api.github.com/repos/xtls/libxray/releases/latest \
            | python3 -c "import json,sys; d=json.load(sys.stdin); \
              urls=[a['browser_download_url'] for a in d.get('assets',[]) if 'android' in a['name'].lower() and a['name'].endswith('.aar')]; \
              print(urls[0] if urls else '')")

          if [ -n "$LIBXRAY_URL" ]; then
            echo "Downloading libxray from: $LIBXRAY_URL"
            curl -fL "$LIBXRAY_URL" -o libs/libxray.aar
            ls -lh libs/libxray.aar
          else
            echo "No AAR found in libxray releases, using stub XrayRunner"
          fi

      - name: Enable libxray in build.gradle if AAR exists
        working-directory: android/app
        run: |
          if [ -f "libs/libxray.aar" ]; then
            sed -i 's|// compileOnly(fileTree|implementation(fileTree|g' build.gradle.kts
            echo "libxray.aar enabled in build"
          fi

      - name: Set up Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          ./gradlew assembleDebug --stacktrace

      - name: Sign APK (debug key)
        working-directory: android
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Built APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swaga-vpn-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          name: SWAGA VPN ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
