# NGINX конфигурация для SWAGA VPN
#
# Файл: /etc/nginx/sites-available/swaga-vpn.ru
# Активация: ln -s /etc/nginx/sites-available/swaga-vpn.ru /etc/nginx/sites-enabled/
#
# Архитектура:
#   - Порт 443 (NGINX) — VLESS трафик + проксирование 3X-UI панели
#   - Порт 2055 (3X-UI) — панель управления напрямую
#   - Бот подключается к 3X-UI напрямую через порт 2055
#
# 3X-UI web base path: /JXmOAqpCBtH14wRJ2t
# (настраивается в 3X-UI → Settings → Panel URL Root Path)

# Редирект HTTP → HTTPS
server {
    listen 80;
    server_name swaga-vpn.ru www.swaga-vpn.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name swaga-vpn.ru www.swaga-vpn.ru;

    # SSL (Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/swaga-vpn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swaga-vpn.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Проксирование 3X-UI панели (через секретный путь) ─────────────────
    # Панель доступна по адресу:
    #   https://swaga-vpn.ru/JXmOAqpCBtH14wRJ2t/panel/
    #
    # API доступен по адресу:
    #   https://swaga-vpn.ru/JXmOAqpCBtH14wRJ2t/panel/api/inbounds/list
    #
    location /JXmOAqpCBtH14wRJ2t/ {
        proxy_pass         http://127.0.0.1:2055/JXmOAqpCBtH14wRJ2t/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket (для xray-ui live logs)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── VLESS fallback (заглушка) ─────────────────────────────────────────
    # Если VLESS настроен через NGINX, здесь будет grpc/ws проксирование.
    # Для tcp+tls (прямое подключение) VLESS работает через xray на 443
    # и этот блок не нужен.

    # ── Заглушка по умолчанию ─────────────────────────────────────────────
    location / {
        return 404;
    }
}
